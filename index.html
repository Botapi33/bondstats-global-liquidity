<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Liquidity Monitor | BondStats</title>

<style>

:root{
  --bg:#030606;
  --bg2:#050908;
  --surface:#08100d;
  --surface2:#0a1310;

  --text:#f1f6f3;
  --muted:#91a098;
  --muted2:#5f7067;

  --line:rgba(130,165,148,.15);
  --line2:rgba(130,165,148,.27);

  --green:#37df91;
  --green2:#78f5b6;
  --green-soft:rgba(55,223,145,.08);
  --green-glow:rgba(55,223,145,.18);

  --warm:#e9ac69;
  --red:#e97b72;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;

  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(55,223,145,.08),
      transparent 32%
    ),
    #030606;

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
}

body{
  padding:18px;
}

.app{
  width:100%;
  max-width:1320px;
  margin:0 auto;

  border:1px solid var(--line);
  border-radius:20px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(8,14,12,.98),
      rgba(3,7,6,.99)
    );

  box-shadow:
    0 28px 90px rgba(0,0,0,.42);
}


/* =====================================================
   HEADER
===================================================== */

.top{
  min-height:50px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

  padding:0 24px;

  border-bottom:1px solid var(--line);
}

.identity{
  display:flex;
  align-items:center;
  gap:11px;
}

.identity-dot{
  width:7px;
  height:7px;

  flex:0 0 auto;

  border-radius:100px;

  background:var(--green);

  box-shadow:
    0 0 15px rgba(55,223,145,.8);
}

.identity-name{
  color:var(--green2);

  font-size:10px;
  font-weight:700;

  letter-spacing:.19em;
  text-transform:uppercase;
}

.top-status{
  display:flex;
  gap:20px;

  color:var(--muted2);

  font-size:9px;

  letter-spacing:.12em;
  text-transform:uppercase;
}


/* =====================================================
   INTRO
===================================================== */

.intro{
  display:grid;

  grid-template-columns:
    minmax(0,1.25fr)
    minmax(260px,.75fr);

  gap:48px;

  padding:38px 34px 36px;

  border-bottom:1px solid var(--line);
}

.intro > *{
  min-width:0;
}

.overline{
  margin-bottom:13px;

  color:var(--muted2);

  font-size:9px;
  font-weight:700;

  letter-spacing:.17em;
  text-transform:uppercase;
}

h1{
  margin:0;

  font-size:
    clamp(37px,5vw,64px);

  line-height:.98;

  letter-spacing:-.048em;

  font-weight:650;
}

.intro-copy{
  margin-top:17px;

  max-width:720px;

  color:var(--muted);

  font-size:14px;
  line-height:1.72;
}

.release{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:1px;

  align-self:end;

  background:var(--line);

  border:1px solid var(--line);

  border-radius:13px;

  overflow:hidden;
}

.release-cell{
  min-width:0;

  padding:16px;

  background:
    rgba(8,14,12,.96);
}

.release-label{
  color:var(--muted2);

  font-size:8px;
  font-weight:700;

  letter-spacing:.13em;
  text-transform:uppercase;
}

.release-value{
  margin-top:7px;

  font-size:17px;
  font-weight:620;
}

.release-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}


/* =====================================================
   OBSERVATORY
===================================================== */

.observatory{
  display:grid;

  grid-template-columns:
    minmax(300px,.82fr)
    minmax(0,1.18fr);

  min-height:420px;

  border-bottom:1px solid var(--line);
}


/* =====================================================
   PULSE / HALO
===================================================== */

.pulse-side{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:0;

  padding:40px 24px;

  overflow:hidden;

  border-right:1px solid var(--line);

  background:
    radial-gradient(
      circle at center,
      rgba(55,223,145,.07),
      transparent 55%
    );
}

.pulse-side::before{
  content:"";

  position:absolute;

  width:430px;
  height:430px;

  border:1px solid rgba(55,223,145,.055);
  border-radius:50%;
}

.pulse-side::after{
  content:"";

  position:absolute;

  width:330px;
  height:330px;

  border:1px solid rgba(55,223,145,.08);
  border-radius:50%;
}

.pulse{
  position:relative;
  z-index:2;

  width:250px;
  height:250px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  border-radius:50%;

  border:
    1px solid
    rgba(81,230,157,.35);

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(55,223,145,.10),
      rgba(4,9,7,.90) 68%
    );

  box-shadow:
    0 0 70px rgba(55,223,145,.08),
    inset 0 0 40px rgba(55,223,145,.025);
}

.pulse::before{
  content:"";

  position:absolute;

  inset:13px;

  border-radius:50%;

  border:
    1px solid
    rgba(55,223,145,.12);
}

.pulse-label{
  position:relative;

  color:var(--muted);

  font-size:8px;
  font-weight:700;

  letter-spacing:.16em;

  text-transform:uppercase;
}

.pulse-value{
  position:relative;

  margin-top:12px;

  color:var(--green2);

  font-size:37px;

  line-height:1;

  font-weight:650;

  letter-spacing:-.045em;
}

.pulse-caption{
  position:relative;

  margin-top:10px;

  max-width:150px;

  color:var(--muted);

  font-size:10px;
  line-height:1.45;
}


/* =====================================================
   REGIME + FLOWS
===================================================== */

.flow-side{
  min-width:0;
}

.regime{
  padding:29px 30px 27px;

  border-bottom:1px solid var(--line);

  background:
    linear-gradient(
      90deg,
      rgba(55,223,145,.055),
      transparent 67%
    );
}

.regime-label{
  color:var(--muted);

  font-size:9px;
  font-weight:700;

  letter-spacing:.16em;
  text-transform:uppercase;
}

.regime-name{
  margin-top:10px;

  color:var(--green2);

  font-size:
    clamp(27px,3.6vw,46px);

  line-height:1;

  font-weight:650;

  letter-spacing:-.042em;

  text-transform:uppercase;
}

.regime-description{
  margin-top:13px;

  max-width:740px;

  color:#b8c5be;

  font-size:13px;
  line-height:1.68;
}


/* =====================================================
   FLOW ROWS
===================================================== */

.flows{
  padding:10px 30px 24px;
}

.flow{
  display:grid;

  grid-template-columns:
    110px
    minmax(0,1fr)
    115px;

  align-items:center;

  gap:22px;

  padding:18px 0;

  border-bottom:1px solid var(--line);
}

.flow:last-child{
  border-bottom:0;
}

.flow-code{
  color:var(--muted2);

  font-size:9px;

  letter-spacing:.14em;
  text-transform:uppercase;
}

.flow-name{
  margin-top:5px;

  color:#dfe8e3;

  font-size:12px;
  font-weight:600;
}

.flow-main{
  min-width:0;
}

.flow-number{
  display:flex;
  align-items:baseline;

  gap:10px;

  min-width:0;
}

.flow-amount{
  font-size:
    clamp(24px,3vw,35px);

  font-weight:650;

  letter-spacing:-.035em;

  font-variant-numeric:
    tabular-nums;
}

.flow-growth{
  color:var(--green);

  font-size:12px;

  font-weight:650;

  white-space:nowrap;
}

.flow-growth.down{
  color:var(--warm);
}

.flow-track{
  position:relative;

  width:100%;
  height:3px;

  margin-top:11px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.045);
}

.flow-bar{
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      rgba(55,223,145,.35),
      var(--green)
    );

  box-shadow:
    0 0 12px
    rgba(55,223,145,.25);
}

.flow-scope{
  color:var(--muted);

  font-size:10px;

  line-height:1.45;

  text-align:right;
}


/* =====================================================
   BOTTOM INTELLIGENCE STRIP
===================================================== */

.intelligence{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  border-bottom:1px solid var(--line);
}

.intel{
  min-width:0;

  padding:21px 22px 20px;

  border-right:1px solid var(--line);
}

.intel:last-child{
  border-right:0;
}

.intel-label{
  color:var(--muted2);

  font-size:8px;

  letter-spacing:.12em;
  text-transform:uppercase;

  font-weight:700;
}

.intel-value{
  margin-top:9px;

  font-size:19px;

  line-height:1.2;

  font-weight:620;
}

.intel-value.green{
  color:var(--green2);
}

.intel-sub{
  margin-top:7px;

  color:var(--muted);

  font-size:10px;

  line-height:1.5;
}


/* =====================================================
   EXPLANATION
===================================================== */

.explanation{
  display:grid;

  grid-template-columns:
    minmax(0,1.2fr)
    minmax(280px,.8fr);
}

.reading{
  min-width:0;

  padding:29px 30px 31px;

  border-right:1px solid var(--line);
}

.method{
  min-width:0;

  padding:29px 30px 31px;

  background:
    rgba(255,255,255,.006);
}

.small-title{
  color:var(--muted);

  font-size:9px;
  font-weight:700;

  letter-spacing:.15em;
  text-transform:uppercase;
}

.explanation h3{
  margin:10px 0 0;

  font-size:23px;

  line-height:1.15;

  font-weight:630;

  letter-spacing:-.025em;
}

.reading-text{
  margin-top:11px;

  max-width:760px;

  color:#b4c0ba;

  font-size:13px;

  line-height:1.75;
}

.method-list{
  margin-top:15px;

  border-top:1px solid var(--line);
}

.method-row{
  display:flex;

  justify-content:space-between;

  gap:18px;

  padding:10px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.04);

  font-size:11px;
}

.method-row span:first-child{
  color:#d9e3de;
}

.method-row span:last-child{
  min-width:0;

  color:var(--muted);

  text-align:right;

  overflow-wrap:anywhere;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
  display:flex;

  justify-content:space-between;

  gap:20px;

  padding:14px 30px 16px;

  border-top:1px solid var(--line);

  color:var(--muted2);

  font-size:9px;

  line-height:1.6;

  letter-spacing:.07em;

  text-transform:uppercase;
}

.footer strong{
  color:#94a39b;
}


/* =====================================================
   STATES
===================================================== */

.loading{
  min-height:560px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:var(--muted);

  font-size:10px;

  letter-spacing:.15em;

  text-transform:uppercase;
}

.error{
  margin:70px auto;

  max-width:720px;

  padding:24px;

  border:
    1px solid
    rgba(233,123,114,.25);

  border-radius:12px;

  background:
    rgba(233,123,114,.04);

  color:#efb3ac;

  font-size:13px;

  line-height:1.7;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:980px){

  .intro{
    grid-template-columns:1fr;
  }

  .observatory{
    grid-template-columns:1fr;
  }

  .pulse-side{
    min-height:350px;

    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .intelligence{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .intel:nth-child(2){
    border-right:0;
  }

  .intel:nth-child(-n+2){
    border-bottom:1px solid var(--line);
  }

  .explanation{
    grid-template-columns:1fr;
  }

  .reading{
    border-right:0;
    border-bottom:1px solid var(--line);
  }

}

@media(max-width:650px){

  body{
    padding:10px;
  }

  .app{
    border-radius:13px;
  }

  .top{
    display:block;

    padding:14px 16px;
  }

  .top-status{
    margin-top:10px;

    flex-wrap:wrap;
  }

  .intro,
  .regime,
  .flows,
  .reading,
  .method,
  .footer{
    padding-left:17px;
    padding-right:17px;
  }

  .release{
    grid-template-columns:1fr;
  }

  .flow{
    grid-template-columns:1fr;

    gap:8px;
  }

  .flow-scope{
    text-align:left;
  }

  .intelligence{
    grid-template-columns:1fr;
  }

  .intel,
  .intel:nth-child(2){
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .intel:last-child{
    border-bottom:0;
  }

  .footer{
    display:block;
  }

  .footer > div + div{
    margin-top:8px;
  }

}

</style>
</head>

<body>

<div id="app" class="app">

  <div class="loading">
    Reading global liquidity…
  </div>

</div>


<script>

const API_URL = "./data.json";


/* =====================================================
   SAFE HELPERS
===================================================== */

function number(value){

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


function text(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "—";
  }

  return String(value);

}


/*
  BIS publication tables display amount
  outstanding in billions of the respective
  currency.

  The current API-derived JSON may contain
  either:
  - values already expressed in billions
  - underlying values expressed in millions

  This handles both safely.
*/

function trillions(value){

  const n = number(value);

  if(n === null){
    return null;
  }

  const abs = Math.abs(n);

  if(abs >= 1000000){

    /* millions -> trillions */
    return n / 1000000;

  }

  /* billions -> trillions */
  return n / 1000;

}


function amount(value,symbol){

  const t = trillions(value);

  if(t === null){
    return "—";
  }

  return symbol + t.toFixed(2) + "T";

}


function growth(value){

  const n = number(value);

  if(n === null){
    return "—";
  }

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(1) +
    "%"
  );

}


function growthClass(value){

  const n = number(value);

  if(
    n !== null &&
    n < 0
  ){
    return "down";
  }

  return "";

}


function formatTimestamp(value){

  if(!value){
    return "—";
  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return "—";
  }

  return d.toLocaleDateString(
    "en-US",
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );

}


/* =====================================================
   CALCULATIONS
===================================================== */

function averageGrowth(items){

  const values =
    items
      .map(item => number(item.growth))
      .filter(value => value !== null);

  if(!values.length){
    return null;
  }

  return (
    values.reduce(
      (a,b) => a+b,
      0
    )
    /
    values.length
  );

}


function strongestCurrency(items){

  const valid =
    items
      .filter(
        item =>
          number(item.growth) !== null
      )
      .sort(
        (a,b) =>
          number(b.growth)
          -
          number(a.growth)
      );

  if(!valid.length){
    return null;
  }

  return valid[0];
}


function flowWidth(value,maxValue){

  const n = number(value);
  const m = number(maxValue);

  if(
    n === null ||
    m === null ||
    m <= 0
  ){
    return 8;
  }

  const width =
    Math.abs(n) /
    m *
    100;

  return Math.max(
    8,
    Math.min(
      width,
      100
    )
  );

}


/* =====================================================
   RENDER
===================================================== */

function render(data){

  const currencies =
    data.currencies || {};

  const usd =
    currencies.usd || {};

  const eur =
    currencies.eur || {};

  const jpy =
    currencies.jpy || {};

  const regime =
    data.regime || {};

  const items = [
    {
      ...usd,
      code:"USD",
      symbol:"$",
      name:"US Dollar Credit"
    },
    {
      ...eur,
      code:"EUR",
      symbol:"€",
      name:"Euro Credit"
    },
    {
      ...jpy,
      code:"JPY",
      symbol:"¥",
      name:"Yen Credit"
    }
  ];

  const avg =
    averageGrowth(items);

  const leader =
    strongestCurrency(items);

  const growthNumbers =
    items
      .map(
        item =>
          Math.abs(
            number(item.growth) || 0
          )
      );

  const maxGrowth =
    Math.max(
      ...growthNumbers,
      1
    );


  document
    .getElementById("app")
    .innerHTML = `


    <header class="top">

      <div class="identity">

        <div class="identity-dot"></div>

        <div class="identity-name">
          BondStats Liquidity Observatory
        </div>

      </div>


      <div class="top-status">

        <span>
          BIS Global Liquidity Indicators
        </span>

        <span>
          Automated Data Layer
        </span>

      </div>

    </header>



    <section class="intro">

      <div>

        <div class="overline">
          Global Funding System
        </div>

        <h1>
          Global Liquidity Monitor
        </h1>

        <div class="intro-copy">
          Follow the foreign-currency credit
          moving through the international
          financial system — across dollars,
          euros and yen.
        </div>

      </div>


      <div class="release">


        <div class="release-cell">

          <div class="release-label">
            Latest BIS Period
          </div>

          <div class="release-value">
            ${text(data.period)}
          </div>

          <div class="release-sub">
            Global Liquidity Indicators
          </div>

        </div>


        <div class="release-cell">

          <div class="release-label">
            Data Refresh
          </div>

          <div class="release-value">
            ${formatTimestamp(data.updatedAt)}
          </div>

          <div class="release-sub">
            Updates automatically
            when new data is processed.
          </div>

        </div>


      </div>

    </section>



    <section class="observatory">


      <div class="pulse-side">

        <div class="pulse">

          <div class="pulse-label">
            Global Liquidity Pulse
          </div>

          <div class="pulse-value">
            ${
              avg === null
                ? "—"
                :
                (
                  (avg > 0 ? "+" : "")
                  +
                  avg.toFixed(1)
                  +
                  "%"
                )
            }
          </div>

          <div class="pulse-caption">
            Average annual growth
            across the three major
            funding currencies
          </div>

        </div>

      </div>



      <div class="flow-side">


        <div class="regime">

          <div class="regime-label">
            Current Liquidity Regime
          </div>

          <div class="regime-name">
            ${text(regime.name)}
          </div>

          <div class="regime-description">
            ${text(regime.description)}
          </div>

        </div>


        <div class="flows">


          ${items.map(item => `

            <div class="flow">

              <div>

                <div class="flow-code">
                  ${item.code}
                </div>

                <div class="flow-name">
                  ${item.name}
                </div>

              </div>


              <div class="flow-main">

                <div class="flow-number">

                  <div class="flow-amount">
                    ${
                      amount(
                        item.amount,
                        item.symbol
                      )
                    }
                  </div>

                  <div class="
                    flow-growth
                    ${growthClass(
                      item.growth
                    )}
                  ">
                    ${
                      growth(
                        item.growth
                      )
                    }
                    YoY
                  </div>

                </div>


                <div class="flow-track">

                  <div
                    class="flow-bar"
                    style="
                      width:
                      ${
                        flowWidth(
                          item.growth,
                          maxGrowth
                        )
                      }%
                    "
                  ></div>

                </div>

              </div>


              <div class="flow-scope">
                ${text(item.scope)}
              </div>

            </div>

          `).join("")}


        </div>

      </div>


    </section>



    <section class="intelligence">


      <div class="intel">

        <div class="intel-label">
          Liquidity Regime
        </div>

        <div class="intel-value green">
          ${text(regime.name)}
        </div>

        <div class="intel-sub">
          Rules-based classification
          from annual funding growth.
        </div>

      </div>



      <div class="intel">

        <div class="intel-label">
          Strongest Growth
        </div>

        <div class="intel-value">
          ${
            leader
              ? leader.code
              : "—"
          }
        </div>

        <div class="intel-sub">
          ${
            leader
              ?
                growth(
                  leader.growth
                )
                +
                " annual credit growth."
              :
                "No valid observation."
          }
        </div>

/* =====================================================
   DATA LOAD
===================================================== */

async function load(){

  try{

    const response =
      await fetch(
        API_URL +
        "?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Liquidity data request failed."
      );

    }

    const data =
      await response.json();

    if(
      !data ||
      data.ok !== true
    ){

      throw new Error(
        data?.error ||
        data?.message ||
        "Liquidity data unavailable."
      );

    }

    if(
      !data.currencies ||
      !data.currencies.usd ||
      !data.currencies.eur ||
      !data.currencies.jpy
    ){

      throw new Error(
        "Required BIS currency data is incomplete."
      );

    }

    render(data);

  }

  catch(error){

    document
      .getElementById("app")
      .innerHTML = `

        <div class="error">

          <strong>
            Global Liquidity Monitor
          </strong>

          <br><br>

          Global liquidity data is
          temporarily unavailable.

          <br><br>

          ${
            error?.message ||
            "Unknown data error."
          }

        </div>

      `;

  }

}

load();

</script>
