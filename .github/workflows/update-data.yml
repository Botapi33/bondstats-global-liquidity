name: Update Global Liquidity Data

on:
  workflow_dispatch:

  schedule:
    - cron: "31 7 * * 1"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update BIS data
        run: python update.py

      - name: Commit updated data
        run: |
          git config user.name "BondStats Data Bot"
          git config user.email "bondstats-data-bot@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update BIS global liquidity data"
            git push
          fi
